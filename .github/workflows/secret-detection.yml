name: CI - repository security

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GITLEAKS_VERSION: 8.30.1

jobs:
  gitleaks:
    name: Secret detection
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # Historique complet : un secret supprimé dans un commit récent
      # reste présent dans les commits précédents
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Gitleaks
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$archive" "$base/$archive"
          curl -sSfL -o checksums.txt "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " $archive\$" checksums.txt | sha256sum --check
          tar -xzf "$archive" gitleaks
          ./gitleaks version

      # --redact : les valeurs détectées ne sont jamais affichées dans les logs
      - name: Scan Git history
        run: |
          ./gitleaks git . --redact --verbose \
            --report-format sarif --report-path gitleaks-report.sarif

      - name: Upload Gitleaks report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: gitleaks-report.sarif
          retention-days: 7
          if-no-files-found: warn
